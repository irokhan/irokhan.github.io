<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build your necropolis, raise a skeleton army, and lead it on raids.">
  <meta name="theme-color" content="#15121d">
  <title>Necropolia Rush · Irokhan</title>
  <script src="languages.js" defer></script>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: #f5ead8;
      background: radial-gradient(ellipse at 50% 36%, #36224b 0, #15121d 63%);
      font: 1rem/1.6 system-ui, sans-serif;
      text-align: center;
    }

    header {
      min-height: 4.5rem;
      padding: 1rem clamp(1.5rem, 6vw, 6rem);
      text-align: end;
    }

    label { margin-inline-end: .5rem; }

    select {
      max-width: 100%;
      min-height: 2.75rem;
      padding: .35rem .65rem;
      color: inherit;
      background: #21192e;
      border: 1px solid #7f6396;
      border-radius: .4rem;
      font: inherit;
    }

    select:focus-visible { outline: 2px solid #e0aafa; }

    main {
      display: grid;
      align-content: center;
      justify-items: center;
      padding: clamp(3rem, 10vh, 7rem) 1.5rem;
    }

    h1 {
      width: min(100%, 40.625rem);
      margin: 0 0 2rem;
    }

    h1 img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    p {
      max-width: 36ch;
      margin: 0;
      text-wrap: balance;
    }

    .intro {
      font-family: Georgia, serif;
      font-size: clamp(1.55rem, 5vw, 2.5rem);
      line-height: 1.25;
    }

    footer {
      margin-inline: clamp(1.5rem, 6vw, 6rem);
      padding: 1.5rem 0;
      border-top: 1px solid #44354f;
      color: #d6c4de;
    }
  </style>
</head>
<body>
  <header>
    <div id="language-controls" hidden>
      <label for="language" id="language-label">Language</label>
      <select id="language"></select>
    </div>
  </header>
  <main>
    <h1><img src="necropolia-rush.png" width="650" height="270" alt="Necropolia Rush"></h1>
    <p class="intro" id="intro">Build your necropolis, raise a skeleton army, and lead it on raids.</p>
  </main>
  <footer>Irokhan</footer>
</body>
</html>
