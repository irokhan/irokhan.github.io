<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build your necropolis, raise a skeleton army, and lead it on raids.">
  <meta name="theme-color" content="#15121d">
  <title>Necropolia Rush · Irokhan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="languages.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Irokhan</a>
    <div id="language-controls" hidden>
      <label for="language" id="language-label">Language</label>
      <select id="language"></select>
    </div>
  </header>
  <main class="home">
    <div class="hero">
      <h1><img src="necropolia-rush.png" width="325" height="135" alt="Necropolia Rush"></h1>
      <p class="intro" id="intro">Build your necropolis, raise a skeleton army, and lead it on raids.</p>
      <div class="platforms">
        <span class="platform"><img src="screens/app-store.png" width="25" height="25" alt="">App Store</span>
        <span class="platform"><img src="screens/google-play.png" width="23" height="25" alt="">Google Play</span>
      </div>
      <p class="release-status" id="release-status">In beta</p>
    </div>
    <section class="gallery" aria-labelledby="gallery-title">
      <h2 id="gallery-title">Screenshots</h2>
      <ul id="screenshots" tabindex="0" aria-labelledby="gallery-title" hidden>
        <li><img width="576" height="1024" decoding="async" alt="A skeleton army on a raid"></li>
        <li><img width="576" height="1024" decoding="async" alt="The necropolis"></li>
        <li><img width="576" height="1024" decoding="async" alt="A boss fight"></li>
        <li><img width="576" height="1024" decoding="async" alt="The tavern"></li>
      </ul>
      <noscript><p class="fallback">Enable JavaScript to see localized screenshots.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <a id="privacy-link" href="privacy.html">Privacy policy</a>
  </footer>
</body>
</html>
