<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build your necropolis, raise a skeleton army, and lead it on raids.">
  <meta name="theme-color" content="#15121d">
  <title>Necropolia Rush · Irokhan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="carousel.js" defer></script>
  <script src="languages.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Irokhan</a>
    <div id="language-controls" hidden>
      <label for="language" id="language-label">Language</label>
      <select id="language"></select>
    </div>
  </header>
  <main class="home">
    <div class="hero">
      <h1><img src="necropolia-rush.png" width="325" height="135" alt="Necropolia Rush"></h1>
      <p class="intro" id="intro">Build your necropolis, raise a skeleton army, and lead it on raids.</p>
      <div class="platforms">
        <span class="platform"><img src="screens/app-store.png" width="25" height="25" alt="">App Store</span>
        <span class="platform"><img src="screens/google-play.png" width="23" height="25" alt="">Google Play</span>
      </div>
      <p class="release-status" id="release-status">In beta</p>
    </div>
    <section class="gallery" id="carousel" aria-label="Screenshots" hidden>
      <div class="carousel-viewport" id="screenshots"></div>
      <div class="carousel-controls">
        <button class="carousel-button" id="carousel-prev" type="button" aria-label="Previous">
          <span aria-hidden="true">‹</span>
        </button>
        <div class="carousel-dots" id="carousel-dots"></div>
        <button class="carousel-button" id="carousel-next" type="button" aria-label="Next">
          <span aria-hidden="true">›</span>
        </button>
        <button class="carousel-button carousel-rotation" id="carousel-play" type="button" aria-label="Pause autoplay">
          <span aria-hidden="true"></span>
        </button>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <a id="privacy-link" href="privacy.html">Privacy policy</a>
  </footer>
</body>
</html>
